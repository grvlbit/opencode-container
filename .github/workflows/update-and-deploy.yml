name: Update and Deploy Docker Image

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if this version already exists'
        required: false
        type: boolean
        default: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get latest opencode version
      id: opencode
      run: |
        VERSION=$(curl -fsSL https://api.github.com/repos/anomalyco/opencode/releases/latest \
          | jq -r '.tag_name')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Latest opencode version: $VERSION"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Check if version already built
      id: check
      run: |
        IMAGE="ghcr.io/${{ github.repository }}"
        VERSION="${{ steps.opencode.outputs.version }}"
        if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
          echo "rebuild=false" >> $GITHUB_OUTPUT
          echo "Image $IMAGE:$VERSION already exists, skipping build."
        else
          echo "rebuild=true" >> $GITHUB_OUTPUT
          echo "Image $IMAGE:$VERSION not found, will build."
        fi

    - name: Set up Docker Buildx
      if: steps.check.outputs.rebuild == 'true' || inputs.force_rebuild
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata
      if: steps.check.outputs.rebuild == 'true' || inputs.force_rebuild
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=latest
          type=raw,value=${{ steps.opencode.outputs.version }}

    - name: Build and push
      if: steps.check.outputs.rebuild == 'true' || inputs.force_rebuild
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          OPENCODE_VERSION=${{ steps.opencode.outputs.version }}
